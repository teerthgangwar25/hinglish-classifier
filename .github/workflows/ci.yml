name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - name: Install test dependencies
        run: pip install -r requirements-serve.txt pytest httpx pandas scikit-learn ruff
      - name: Lint (syntax errors and unused or undefined names only)
        run: ruff check src tests --select E9,F
      - name: Unit and API tests
        run: python -m pytest -q

  gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - name: Install dependencies
        run: pip install -r requirements-serve.txt pandas scikit-learn huggingface_hub
      - name: Download model bundle and smoke set (private HF repo)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('teerth025/hinglish-classifier-ci', local_dir='ci_assets')"
      - name: Smoke gate
        run: python src/smoke_eval.py --model-dir ci_assets/model --smoke-csv ci_assets/smoke/smoke_set.csv

  image:
    needs: [test, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/teerthgangwar25/hinglish-classifier:${{ github.sha }}
            ghcr.io/teerthgangwar25/hinglish-classifier:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max